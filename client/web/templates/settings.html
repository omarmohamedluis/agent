<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Agent Settings</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <h2 id="loadingMessage">Processing...</h2>
        <button id="emergencyUnlock" onclick="document.getElementById('loadingOverlay').style.display='none'"
            title="Emergency Unlock"></button>
    </div>

    <header>
        <div class="brand">
            <img src="/assets/omarpi.png" alt="OMI Logo">
            <span>OMI Agent Settings</span>
        </div>
        <nav>
            <a href="/" class="btn btn-nav">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </nav>
    </header>

    <main>
        <div class="settings-container">
            <section class="section">
                <h2><i class="fas fa-network-wired"></i> Network Configuration</h2>
                <form id="network-form">

                    <!-- 1. Configuración General -->
                    <div class="config-section">
                        <h3>Configuración General</h3>
                        <div class="compact-grid">
                            <div class="form-group full">
                                <label>Mode</label>
                                <select id="net-mode" name="mode">
                                    <option value="dhcp" {{ 'selected' if network.mode=='dhcp' else '' }}>DHCP</option>
                                    <option value="static" {{ 'selected' if network.mode=='static' else '' }}>Static IP
                                    </option>
                                </select>
                            </div>

                            <!-- Increased gap to 30px to prevent overlapping -->
                            <div id="static-config" class="full compact-grid"
                                style="display: {{ 'grid' if network.mode == 'static' else 'none' }}; grid-template-columns: 1fr 1fr 1fr; gap: 30px;">
                                <div class="form-group">
                                    <label>IP Address</label>
                                    <input type="text" name="ip" value="{{ network.ip or '' }}"
                                        placeholder="192.168.1.100">
                                </div>
                                <div class="form-group">
                                    <label>Subnet Mask</label>
                                    <input type="text" name="mask" value="{{ network.mask or '' }}"
                                        placeholder="255.255.255.0">
                                </div>
                                <div class="form-group">
                                    <label>Gateway</label>
                                    <input type="text" name="gateway" value="{{ network.gateway or '' }}"
                                        placeholder="192.168.1.1">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Configuración VLAN -->
                    <div class="config-section">
                        <h3>Configuración VLAN</h3>
                        <div class="compact-grid">
                            <div class="form-group full">
                                <label>VLAN ID</label>
                                <div class="vlan-group">
                                    <input type="number" id="vlan-id" name="vlan" value="{{ network.vlan or '' }}"
                                        min="1" max="4094" class="vlan-input" {{ 'disabled' if network.vlan_from_service
                                        else '' }}>

                                    <label class="checkbox-container">
                                        <input type="checkbox" id="vlan-from-service" name="vlan_from_service"
                                            value="true" {{ 'checked' if network.vlan_from_service else '' }}>
                                        <span class="checkbox-label">Desde el servicio</span>
                                    </label>
                                </div>
                            </div>

                            <!-- VLAN IP Mode -->
                            <div class="form-group full">
                                <label>VLAN IP Mode</label>
                                <select id="vlan-mode" name="vlan_mode">
                                    <option value="dhcp" {{ 'selected' if network.vlan_mode=='dhcp' else '' }}>DHCP
                                        (Automático)</option>
                                    <option value="static" {{ 'selected' if network.vlan_mode=='static' else '' }}>
                                        Manual (Estático)</option>
                                </select>
                            </div>

                            <!-- VLAN IP Fields -->
                            <div id="vlan-static-config" class="full compact-grid"
                                style="display: {{ 'grid' if network.vlan_mode == 'static' else 'none' }}; grid-template-columns: 1fr 1fr 1fr; gap: 30px;">
                                <div class="form-group">
                                    <label>VLAN IP</label>
                                    <input type="text" name="vlan_ip" value="{{ network.vlan_ip or '' }}"
                                        placeholder="VLAN IP">
                                </div>
                                <div class="form-group">
                                    <label>VLAN Mask</label>
                                    <input type="text" name="vlan_mask" value="{{ network.vlan_mask or '' }}"
                                        placeholder="VLAN Netmask">
                                </div>
                                <div class="form-group">
                                    <label>VLAN Gateway</label>
                                    <input type="text" name="vlan_gateway" value="{{ network.vlan_gateway or '' }}"
                                        placeholder="VLAN Gateway">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save & Apply</button>
                </form>
            </section>

            <section class="section">
                <h2><i class="fas fa-sync-alt"></i> Software Update</h2>
                <div class="actions" id="update-actions">
                    <button onclick="checkForUpdates()" class="btn btn-primary" style="width: auto;">
                        <i class="fas fa-search"></i> Check for Updates
                    </button>
                </div>
                <div id="branch-selection"
                    style="display: none; margin-top: 1.5rem; border-top: 1px solid #333; padding-top: 1rem;">
                    <p style="margin-bottom: 0.8rem;">Select Branch:</p>
                    <select id="branch-select"
                        style="width: 100%; margin-bottom: 1rem; padding: 0.7rem; border-radius: 6px;">
                        <!-- Branches will be injected here -->
                    </select>
                    <button onclick="startUpdate()" class="btn btn-primary" style="width: auto;">
                        <i class="fas fa-download"></i> Install Update now
                    </button>
                    <button onclick="cancelUpdate()" class="btn btn-secondary"
                        style="margin-left: 0.5rem; width: auto;">
                        Cancel
                    </button>
                </div>
            </section>

            <section class="section">
                <h2><i class="fas fa-power-off"></i> System Control</h2>
                <div class="actions">
                    <button onclick="systemAction('reboot')" class="btn btn-danger" style="width: auto;">
                        <i class="fas fa-sync"></i> Reboot System
                    </button>
                    <button onclick="systemAction('shutdown')" class="btn btn-danger" style="width: auto;">
                        <i class="fas fa-power-off"></i> Shutdown System
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.getElementById('net-mode').addEventListener('change', function (e) {
            document.getElementById('static-config').style.display =
                e.target.value === 'static' ? 'grid' : 'none';
        });

        document.getElementById('vlan-mode').addEventListener('change', function (e) {
            document.getElementById('vlan-static-config').style.display =
                e.target.value === 'static' ? 'grid' : 'none';
        });

        document.getElementById('vlan-from-service').addEventListener('change', function (e) {
            const vlanInput = document.getElementById('vlan-id');
            vlanInput.disabled = e.target.checked;
        });

        document.getElementById('network-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Convert checkbox to boolean
            data.vlan_from_service = document.getElementById('vlan-from-service').checked;

            // Ensure numeric VLAN if present
            if (data.vlan) data.vlan = parseInt(data.vlan);
            else data.vlan = null;

            // If disabled (from service), we might still want to send the value if it exists in the input?
            if (document.getElementById('vlan-id').disabled) {
                const val = document.getElementById('vlan-id').value;
                if (val) data.vlan = parseInt(val);
            }

            try {
                const res = await fetch('/api/network/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) alert('Network settings applied!');
                else alert('Failed to apply settings');
            } catch (err) {
                console.error(err);
                alert('Error saving settings');
            }
        });

        async function systemAction(action) {
            if (!confirm(`Are you sure you want to ${action}?`)) return;
            try {
                await fetch(`/api/system/${action}`, { method: 'POST' });
                alert(`System ${action} initiated...`);
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                if (!response.ok) return;
                const data = await response.json();

                const overlay = document.getElementById('loadingOverlay');
                const msg = document.getElementById('loadingMessage');
                const sysStatus = data.system_status || {};

                if (sysStatus.is_busy) {
                    overlay.style.display = 'flex';
                    msg.textContent = sysStatus.busy_message || "Processing...";
                } else {
                    overlay.style.display = 'none';
                }
            } catch (e) {
                console.error("Polling error:", e);
            }
        }

        async function checkForUpdates() {
            const btn = document.querySelector('#update-actions button');
            const branchSelection = document.getElementById('branch-selection');
            const branchSelect = document.getElementById('branch-select');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

            try {
                const res = await fetch('/api/repo/branches');
                const data = await res.json();

                if (data.branches) {
                    branchSelect.innerHTML = data.branches.map(b => `<option value="${b}" ${b === 'main' ? 'selected' : ''}>${b}</option>`).join('');
                    branchSelection.style.display = 'block';
                } else {
                    alert('Could not fetch branches.');
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to local API.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Check for Updates';
            }
        }

        function cancelUpdate() {
            document.getElementById('branch-selection').style.display = 'none';
        }

        async function startUpdate() {
            const branch = document.getElementById('branch-select').value;
            if (!confirm(`Confirm update to branch "${branch}"? This will stop all services and reboot the system.`)) return;

            try {
                const res = await fetch('/api/system/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ branch: branch })
                });

                if (res.ok) {
                    // Start polling immediately to show the "UPDATING" overlay
                    updateStatus();
                } else {
                    alert('Failed to start update.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        setInterval(updateStatus, 2000);
    </script>
</body>

</html>
