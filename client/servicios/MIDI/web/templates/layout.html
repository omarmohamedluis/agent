<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{PAGE_TITLE}}</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --card: #161616;
            --text: #f0f0f0;
            --muted: #888;
            --accent: #3fb950;
            --accent-hover: #4fd362;
            --danger: #f85149;
            --danger-text: #ff7b72;
            --line: #30363d;
            --input-bg: #0d1117;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--line);
            background: #161b22;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
        }

        .nav {
            display: flex;
            gap: 4px;
        }

        .nav-link {
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            text-decoration: none;
        }

        .nav-link.active {
            background: var(--line);
            font-weight: 500;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .stack>*+* {
            margin-top: 24px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .card-body {
            padding: 24px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .section-title p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #21262d;
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        .btn.primary {
            background: var(--accent);
            border-color: rgba(240, 246, 252, 0.1);
            color: #fff;
        }

        .btn.primary:hover {
            background: var(--accent-hover);
        }

        .btn.danger {
            color: var(--danger-text);
        }

        .btn.danger:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .btn.ghost {
            background: transparent;
            border-color: transparent;
            padding: 4px 8px;
        }

        .btn.ghost:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--muted);
            font-weight: 500;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .danger-text {
            color: var(--danger-text);
        }

        .icon {
            font-size: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
        }

        input[type=text],
        input[type=number],
        select {
            width: 100%;
            padding: 8px 12px;
            background: var(--input-bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
        }

        .form-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        .info-block {
            background: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.2);
            border-radius: 6px;
            padding: 16px;
            color: #79c0ff;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            background: var(--line);
            color: var(--muted);
        }

        /* Console Overlay */
        #consoleOverlay {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 600px;
            height: 400px;
            background: #000;
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            z-index: 1000;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        #consoleOverlay .console-header {
            padding: 8px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }

        #consoleOverlay .console-header span {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #consoleOverlay .console-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            line-height: 1;
        }

        #consoleOverlay .console-close:hover {
            color: var(--danger-text);
        }

        #consoleOverlay .console-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #d1d5db;
        }

        #consoleOverlay .log-entry {
            margin-bottom: 4px;
            white-space: pre-wrap;
        }

        #consoleOverlay .log-success {
            color: var(--accent);
        }

        #consoleOverlay .log-error {
            color: var(--danger-text);
        }

        #consoleOverlay .log-info {
            color: #58a6ff;
        }
    </style>
    {{EXTRA_HEAD|safe}}
</head>

<body data-page="{{PAGE_ID}}">
    <header class="topbar">
        <div class="brand">{{BRAND_HTML|safe}}</div>
        <div id="midiActivity"
            style="font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--line); display: none;">
            <span style="color: var(--accent); margin-right: 8px;">●</span> <span id="midiActivityText">Esperando
                MIDI...</span>
        </div>
        <nav class="nav">{{NAV_LINKS|safe}}</nav>
    </header>
    <main class="container stack">
        {{BODY_HTML|safe}}
    </main>

    <!-- Console Overlay -->
    <div id="consoleOverlay">
        <div class="console-header">
            <span>Consola de Diagnóstico</span>
            <button class="console-close" id="consoleClose">&times;</button>
        </div>
        <div class="console-body" id="consoleBody"></div>
    </div>

    <script src="/static/midi.js"></script>{{EXTRA_JS|safe}}
</body>

</html>
