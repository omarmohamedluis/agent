<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="/static/styles.css">
    {{EXTRA_HEAD|safe}}
</head>

<body data-page="{{PAGE_ID}}">
    <header class="topbar">
        <div class="brand"><strong>OMIMIDI</strong> — {{ host }}</div>
        <div id="midiActivity" class="activity-indicator">
            <span class="activity-dot">●</span> <span id="midiActivityText">Esperando MIDI...</span>
        </div>
        <nav class="nav">
            {% for item in nav_items %}
            <a class="nav-link {% if item[0] == active %}active{% endif %}" href="{{ item[2] }}">{{ item[1] }}</a>
            {% endfor %}
        </nav>
    </header>
    <main class="container stack">
        {{BODY_HTML|safe}}
    </main>

    <!-- Console Overlay -->
    <div id="consoleOverlay">
        <div class="console-header">
            <span>Consola de Diagnóstico</span>
            <button class="console-close" id="consoleClose">&times;</button>
        </div>
        <div class="console-body" id="consoleBody"></div>
    </div>

    <script src="/static/midi.js?v={{ range(10000, 20000) | random }}"></script>{{EXTRA_JS|safe}}
</body>

</html>
