<form id="configForm" method="post" action="/config/save" class="stack">
  <section class="card stack">

    <!-- 1. Configuración General -->
    <div class="config-section">
      <h3>Configuración General</h3>
      <div class="compact-grid">
        <div class="form-group">
          <label>Nombre del Preset</label>
          <input type="text" name="config_name" value="{{ config_name }}" maxlength="64">
        </div>
        <div class="form-group">
          <label>Puerto WebUI</label>
          <input type="number" name="ui_port" value="{{ ui_port }}" min="1" max="65535">
        </div>
      </div>
    </div>

    <!-- 2. Configuración VLAN -->
    <div class="config-section">
      <h3>Configuración VLAN</h3>
      <div class="compact-grid">
        <div class="form-group full">
          <label>VLAN ID</label>
          <div class="vlan-group">
            <input type="number" name="vlan" value="{{ vlan }}" min="1" max="4094" class="vlan-input">
            <label class="checkbox-container">
              <input type="checkbox" id="vlanActive" name="vlan_active" value="true" {% if vlan_active %}checked{% endif
                %}>
              <span class="checkbox-label">Activar VLAN</span>
            </label>
          </div>
        </div>

        <div class="form-group full">
          <label>Modo IP</label>
          <select name="vlan_mode" id="vlanMode" class="form-control">
            <option value="dhcp" {% if vlan_mode=='dhcp' %}selected{% endif %}>DHCP (Automático)</option>
            <option value="static" {% if vlan_mode=='static' %}selected{% endif %}>Manual (Estático)</option>
          </select>
        </div>

        <div id="staticIpFields" class="span-2 compact-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Dirección IP</label>
            <input type="text" name="vlan_ip" value="{{ vlan_ip }}" class="form-control"
              placeholder="Ej: 192.168.100.10">
          </div>
          <div class="form-group">
            <label>Máscara (CIDR)</label>
            <input type="text" name="vlan_mask" value="{{ vlan_mask }}" class="form-control"
              placeholder="Ej: 24 o 255.255.255.0">
          </div>
          <div class="form-group">
            <label>Gateway</label>
            <input type="text" name="vlan_gateway" value="{{ vlan_gateway }}" class="form-control"
              placeholder="Opcional">
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Servicio -->
    <div class="config-section">
      <h3>Servicio</h3>
      <div class="compact-grid">
        <div class="form-group full">
          <label>Dispositivo MIDI</label>
          <select name="midi_input">
            {% for m in midi_inputs %}
            <option value="{{ m }}" {% if m==current_midi %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group full">
          <label>IPs OSC</label>
          <input type="text" name="osc_ips" value="{{ osc_ips }}" placeholder="127.0.0.1, 192.168.1.100">
        </div>

        <div class="form-group">
          <label>Puerto OSC</label>
          <input type="number" name="osc_port" value="{{ osc_port }}" min="1" max="65535">
        </div>
      </div>
    </div>
  </section>

  <div class="global-actions">
    <button type="button" class="btn primary" onclick="saveConfig()">Guardar Configuración</button>
    <button type="button" class="btn" id="pingBtn">Ping OSC (IGMP)</button>

    {% if is_config_mode %}
    <button type="button" class="btn danger" id="closeConfigBtn" onclick="closeConfig()">Cerrar Configuración</button>
    {% else %}
    <button type="button" class="btn danger" id="reiniciarBtn">Reiniciar Servicio</button>
    {% endif %}
  </div>

  <script>
    const existingConfigs = {{ existing_configs | tojson }};
    const currentConfigName = "{{ config_name }}";

    async function saveConfig() {
      const form = document.getElementById('configForm');
      const formData = new FormData(form);
      const newName = formData.get('config_name').trim();
      const btn = document.querySelector('button[onclick="saveConfig()"]');

      // Check overwrite (Always warn if exists, per user request)
      if (existingConfigs.includes(newName)) {
        if (!confirm(`La configuración "${newName}" ya existe. ¿Deseas sobreescribirla?`)) {
          return;
        }
      }

      btn.disabled = true;
      btn.innerText = "Guardando...";

      try {
        const resp = await fetch('/api/config/save', {
          method: 'POST',
          body: formData
        });

        if (resp.ok) {
          // Si estamos en modo config, solo notificamos
          {% if is_config_mode %}
          btn.innerText = "Guardado (Offline)";
          await new Promise(r => setTimeout(r, 1000));
          btn.disabled = false;
          btn.innerText = "Guardar Configuración";
          alert("Configuración guardada correctamente.");
          {% else %}
          // Si no, recargamos (comportamiento normal)
          const text = await resp.text();
          document.open();
          document.write(text);
          document.close();
          {% endif %}
        } else {
          let errorMsg = resp.statusText;
          try {
            const errData = await resp.json();
            if (errData.error) errorMsg = errData.error;
          } catch (e) {
            // No JSON body
          }
          alert("Error al guardar: " + errorMsg);
          btn.disabled = false;
          btn.innerText = "Guardar Configuración";
        }
      } catch (e) {
        alert("Error de red: " + e);
        btn.disabled = false;
        btn.innerText = "Guardar Configuración";
      }
    }

    async function closeConfig() {
      if (!confirm("¿Salir del modo configuración sin guardar?")) return;
      try {
        await fetch('/api/close_config', { method: 'POST' });
        window.close();
        document.body.innerHTML = "<h1>Cerrando...</h1>";
      } catch (e) {
        alert("Error cerrando: " + e);
      }
    }
  </script>
</form>
