<section class="card">
  <div class="card-header">
    <h2>Aprendizaje automático (LEARN)</h2>
  </div>
  <div class="card-body">
    <div class="stack">
      <div class="section-title">
        <p>Mueve un control MIDI para detectarlo automáticamente. Revisa los datos y pulsa "Guardar" para crear la ruta.
        </p>
      </div>

      <form method="post" action="/commit_learn" id="learnForm" class="stack">
        <div class="form-grid">
          <div class="full">
            <label>Ruta OSC</label>
            <input type="text" name="osc" value="/D3/learn" id="oscInput" placeholder="/ejemplo/ruta">
          </div>
          <div>
            <label>Tipo de valor</label>
            <select name="vtype" id="vtypeInput">
              <option value="float">Float (0.0 - 1.0)</option>
              <option value="int">Int (0 - 127)</option>
              <option value="bool">Bool (True/False)</option>
              <option value="const">Constante</option>
            </select>
          </div>
          <div id="constRow" style="display:none;">
            <label>Valor constante</label>
            <input type="text" name="const" id="constInput" placeholder="ej: 1.0">
          </div>
        </div>

        <div class="info-block" id="livePreview">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <div class="muted" style="font-size: 12px; margin-bottom: 4px;">RUTA OSC</div>
              <code id="summaryOsc" style="font-weight: 600; color: var(--text);">/D3/learn</code>
            </div>
            <div>
              <div class="muted" style="font-size: 12px; margin-bottom: 4px;">TIPO DE VALOR</div>
              <span id="summaryType" style="font-weight: 600; color: var(--text);">float</span>
            </div>
            <div>
              <div class="muted" style="font-size: 12px; margin-bottom: 4px;">MENSAJE MIDI</div>
              <span id="summaryKind" style="font-weight: 600; color: var(--text);">Esperando…</span>
            </div>
            <div>
              <div class="muted" style="font-size: 12px; margin-bottom: 4px;">ÚLTIMO EVENTO</div>
              <span id="summaryCandidate" style="font-weight: 600; color: var(--accent);">Esperando evento MIDI…</span>
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top: 16px; border-top: 1px solid var(--line); padding-top: 24px;">
          <button class="btn primary" id="learnAccept" type="button" disabled>Guardar Mapeo</button>
          <button class="btn" type="button" id="learnCancel">Cancelar</button>
        </div>

        <div class="muted" id="learnMessage" style="display:none; margin-top: 12px; font-size: 13px;"></div>
      </form>

      <div class="info-block" id="learnResult"
        style="display:none; background: rgba(63, 185, 80, 0.1); border-color: rgba(63, 185, 80, 0.2); color: var(--accent);">
        <div class="muted" style="color: var(--accent); opacity: 0.8; font-size: 12px; margin-bottom: 4px;">ÚLTIMA RUTA
          CREADA</div>
        <div id="resultSummary" style="font-weight: 600;"></div>
        <form method="post" action="/clear_learn_result" style="margin-top:12px;">
          <button class="btn ghost" type="submit"
            style="font-size: 12px; padding: 0; color: var(--accent);">Ocultar</button>
        </form>
      </div>
    </div>
  </div>
</section>
