<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Manager</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1c25;
            --card-bg: #232631;
            --text-color: #e0e6ed;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --border-color: #333a4d;
            --success: #10b981;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .panel-left {
            width: 40%;
            min-width: 450px;
            padding: 24px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-right {
            flex: 1;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal / Console Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--panel-bg);
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
        }

        .modal-title {
            font-weight: 700;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }

        #pingLogModal {
            background: #000;
            border: 1px solid #333;
            min-height: 200px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.85rem;
            border-radius: 6px;
            color: #10b981;
        }

        .ping-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #111;
            padding-bottom: 4px;
        }

        .ping-err {
            color: var(--danger);
        }

        .ping-info {
            color: #3b82f6;
        }

        .status-bar {
            background: var(--input-bg);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4b5563;
        }

        .status-active .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border-left: 4px solid var(--accent-color);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            transform: translateY(10px);
            z-index: 5000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="panel-left">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h1>📡 Satellite Manager</h1>
                <div id="activePresetLabel"
                    style="font-size: 0.8rem; color: #64748b; background: #0f172a; padding: 4px 10px; border-radius: 20px;">
                    Preset: <span id="currentPresetName">-</span>
                </div>
            </header>

            <!-- Satellite Config -->
            <div class="form-section stack">
                <h3>Servicio Satellite</h3>
                <div class="form-group">
                    <label>IP de Companion (Remote)</label>
                    <input type="text" id="remoteIp" placeholder="127.0.0.1">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Puerto Remote</label>
                        <input type="number" id="remotePort">
                    </div>
                    <div class="form-group">
                        <label>Puerto Rest (Web UI)</label>
                        <input type="number" id="restPort">
                    </div>
                </div>
                <label>Plugins Activos</label>
                <div class="grid-2" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius:6px;">
                    <label class="checkbox-group"><input type="checkbox" id="plugin_streamdeck"> StreamDeck</label>
                    <label class="checkbox-group"><input type="checkbox" id="plugin_loupedeck"> Loupedeck</label>
                    <label class="checkbox-group"><input type="checkbox" id="plugin_infinitton"> Infinitton</label>
                </div>
            </div>

            <!-- Network Config -->
            <div class="form-section">
                <h3>Configuración de Red</h3>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="vlan_active"> <b>Habilitar VLAN</b>
                    </label>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>VLAN ID</label>
                        <input type="number" id="vlan_id" min="1" max="4094">
                    </div>
                    <div class="form-group">
                        <label>Modo IP</label>
                        <select id="ip_mode" onchange="toggleStaticFields()">
                            <option value="dhcp">DHCP (Auto)</option>
                            <option value="static">Static (Manual)</option>
                        </select>
                    </div>
                </div>
                <div id="staticFields" style="display: none;">
                    <div class="form-group">
                        <label>Dirección IP</label>
                        <input type="text" id="ip_addr" placeholder="192.168.1.100">
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Máscara (CIDR)</label>
                            <input type="text" id="ip_mask" placeholder="24">
                        </div>
                        <div class="form-group">
                            <label>Gateway</label>
                            <input type="text" id="ip_gw" placeholder="Opcional">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn-success" id="saveBtn" onclick="saveConfig()">💾 Guardar Todo</button>
                <button class="btn-primary" id="pingBtn" onclick="openPingModal()">🌐 Ping</button>
                <button class="btn-secondary" onclick="restartService()">🔄 Reiniciar</button>
                <button class="btn-danger" id="closeConfigBtn" onclick="closeConfig()">🚪 Cerrar</button>
            </div>

            <div class="status-bar" id="statusBar">
                <span id="statusText">Iniciando...</span>
                <div class="status-dot"></div>
            </div>
        </div>

        <div class="panel-right">
            <iframe id="satelliteFrame"></iframe>
        </div>
    </div>

    <!-- Ping Modal -->
    <div id="pingOverlay" class="overlay">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Diagnóstico de Conectividad</span>
                <button class="modal-close" onclick="closePingModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="pingLogModal">Preparando...</div>
                <div style="margin-top: 20px; text-align: right;">
                    <button class="btn-secondary" onclick="closePingModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="loadingOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:20000; justify-content:center; align-items:center; flex-direction:column; color:white; text-align:center;">
        <h2 id="loadingTitle">Instalando</h2>
        <div id="loadingMessage" style="color: #aaa; margin: 20px 0;">...</div>
        <div
            style="width: 300px; height: 6px; background: #222; border-radius: 10px; overflow: hidden; border: 1px solid #333;">
            <div id="progressBar"
                style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.4s;"></div>
        </div>
        <button id="installBtn" class="btn-success" style="margin-top:20px; display:none;"
            onclick="triggerInstall()">INICIAR INSTALACIÓN</button>
    </div>

    <script>
        let ws;
        let activePreset = '';
        let isConfigMode = false;

        async function init() {
            connectWS();
            await loadActivePresetData();
            checkStatus();
            setInterval(checkStatus, 3000);
        }

        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${window.location.host}/ws`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'ping_log') handlePingLog(msg.data);
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        async function loadActivePresetData() {
            try {
                const res = await fetch(`/api/presets/content/active`);
                const data = await res.json();

                activePreset = data._preset_name || 'default';
                document.getElementById('currentPresetName').innerText = activePreset;

                // Satellite
                document.getElementById('remoteIp').value = data.remoteIp || '127.0.0.1';
                document.getElementById('remotePort').value = data.remotePort || 16622;
                document.getElementById('restPort').value = data.restPort || 9999;

                const plugins = data.surfacePluginsEnabled || {};
                document.getElementById('plugin_streamdeck').checked = !!plugins['elgato-streamdeck'];
                document.getElementById('plugin_loupedeck').checked = !!plugins['loupedeck'];
                document.getElementById('plugin_infinitton').checked = !!plugins['infinitton'];

                // Network
                const net = data.net || {};
                document.getElementById('vlan_active').checked = !!net.vlan_active;
                document.getElementById('vlan_id').value = net.vlan || 60;
                document.getElementById('ip_mode').value = net.ip_mode || 'dhcp';
                document.getElementById('ip_addr').value = net.ip || '';
                document.getElementById('ip_mask').value = net.mask || '';
                document.getElementById('ip_gw').value = net.gateway || '';

                toggleStaticFields();

                const iframe = document.getElementById('satelliteFrame');
                const target = `http://${window.location.hostname}:${data.restPort || 9999}`;
                if (iframe.src !== target) iframe.src = target;
            } catch (e) {
                console.error("Error loading active preset", e);
            }
        }

        function toggleStaticFields() {
            const mode = document.getElementById('ip_mode').value;
            document.getElementById('staticFields').style.display = (mode === 'static') ? 'block' : 'none';
        }

        async function saveConfig() {
            const name = activePreset;
            const content = {
                remoteIp: document.getElementById('remoteIp').value,
                remotePort: parseInt(document.getElementById('remotePort').value),
                restPort: parseInt(document.getElementById('restPort').value),
                surfacePluginsEnabled: {
                    "elgato-streamdeck": document.getElementById('plugin_streamdeck').checked,
                    "loupedeck": document.getElementById('plugin_loupedeck').checked,
                    "infinitton": document.getElementById('plugin_infinitton').checked
                },
                net: {
                    vlan: parseInt(document.getElementById('vlan_id').value),
                    vlan_active: document.getElementById('vlan_active').checked,
                    ip_mode: document.getElementById('ip_mode').value,
                    ip: document.getElementById('ip_addr').value,
                    mask: document.getElementById('ip_mask').value,
                    gateway: document.getElementById('ip_gw').value
                }
            };

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            try {
                const res = await fetch('/api/config/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, content })
                });
                const data = await res.json();
                showToast(data.message);

                // Si el preset guardado es el activo (que siempre lo será ahora desde aquí),
                // el agente reiniciará.
                setTimeout(() => location.reload(), 2500);
            } catch (e) {
                showToast("Error guardando");
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 Guardar Todo";
            }
        }

        function openPingModal() {
            const ip = document.getElementById('remoteIp').value;
            if (!ip) return showToast("Falta IP para ping");

            document.getElementById('pingOverlay').style.display = 'flex';
            document.getElementById('pingLogModal').innerHTML = `<div class="ping-entry ping-info">Iniciando ping a ${ip}...</div>`;

            fetch('/api/ping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([ip])
            });
        }

        function closePingModal() {
            document.getElementById('pingOverlay').style.display = 'none';
        }

        function handlePingLog(data) {
            const log = document.getElementById('pingLogModal');
            if (data.summary) {
                log.innerHTML += `<div class="ping-entry" style="color:white; font-weight:bold; margin-top:10px;">Ping finalizado (Total: ${data.total}).</div>`;
                return;
            }
            if (data.type === 'broadcast') {
                log.innerHTML += `<div class="ping-entry ping-info">${data.info}</div>`;
                return;
            }
            const statusClass = data.ok ? '' : 'ping-err';
            const statusText = data.ok ? 'ALCANZADO' : `FALLO (${data.error || 'Timeout'})`;
            log.innerHTML += `<div class="ping-entry ${statusClass}">[${new Date().toLocaleTimeString()}] ${data.ip}: ${statusText}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function restartService() {
            if (!confirm("¿Reiniciar servicio completo? (Red + Satellite)")) return;
            const res = await fetch('/api/restart_service', { method: 'POST' });
            if (res.ok) showToast("Petición de reinicio enviada");
        }

        async function closeConfig() {
            if (!confirm("¿Cerrar modo configuración?")) return;
            try {
                const res = await fetch('/api/close_config', { method: 'POST' });
                // Volver al Dashboard (puerto 8000)
                window.location.href = `http://${window.location.hostname}:8000`;
            } catch (e) {
                console.error("Error closing config", e);
                alert("Error al cerrar modo configuración.");
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const overlay = document.getElementById('loadingOverlay');
                const bar = document.getElementById('progressBar');
                const msg = document.getElementById('loadingMessage');
                const instBtn = document.getElementById('installBtn');

                if (data.state === 'running') {
                    overlay.style.display = 'none';
                    document.getElementById('statusBar').classList.add('status-active');
                    document.getElementById('statusText').innerText = 'En servicio';
                } else if (data.state === 'not_installed') {
                    overlay.style.display = 'flex';
                    document.getElementById('loadingTitle').innerText = 'Satellite no instalado';
                    msg.innerText = 'Se requiere instalación manual.';
                    instBtn.style.display = 'block';
                    bar.parentElement.style.display = 'none';
                } else if (data.state === 'installing' || data.state === 'starting') {
                    overlay.style.display = 'flex';
                    document.getElementById('loadingTitle').innerText = data.state === 'installing' ? 'Instalando...' : 'Iniciando...';
                    instBtn.style.display = 'none';
                    bar.parentElement.style.display = 'block';
                    msg.innerText = data.message || 'Procesando...';
                    bar.style.width = (data.progress || 0) + '%';
                }

                if (data.message && data.message.includes("Modo Configuración")) {
                    isConfigMode = true;
                    document.getElementById('closeConfigBtn').style.display = 'block';
                    document.getElementById('statusText').innerText = 'Modo Config (Offline)';
                }
            } catch (e) {
                document.getElementById('statusText').innerText = 'Desconectado';
            }
        }

        async function triggerInstall() {
            await fetch('/api/install', { method: 'POST' });
            showToast("Instalación solicitada");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        init();
    </script>
</body>

</html>
