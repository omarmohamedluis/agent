<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Manager</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1c25;
            --card-bg: #232631;
            --text-color: #e0e6ed;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --border-color: #333a4d;
            --success: #10b981;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .panel-left {
            width: 40%;
            min-width: 450px;
            padding: 24px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-right {
            flex: 1;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal / Console Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--panel-bg);
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
        }

        .modal-title {
            font-weight: 700;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }

        #pingLogModal {
            background: #000;
            border: 1px solid #333;
            min-height: 200px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.85rem;
            border-radius: 6px;
            color: #10b981;
        }

        .ping-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #111;
            padding-bottom: 4px;
        }

        .ping-err {
            color: var(--danger);
        }

        .ping-info {
            color: #3b82f6;
        }

        .status-bar {
            background: var(--input-bg);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4b5563;
        }

        .status-active .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-config .status-dot {
            background: #f97316;
            /* Orange-500 */
            box-shadow: 0 0 8px #f97316;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border-left: 4px solid var(--accent-color);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            transform: translateY(10px);
            z-index: 5000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Version Checking UI */
        .version-check {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="panel-left">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h1>📡 Satellite Manager</h1>
            </header>

            <!-- Satellite Config -->
            <div class="form-section stack">
                <h3>Configuración del Servicio</h3>
                <div class="form-group">
                    <label>Nombre del Preset (Configuración)</label>
                    <input type="text" id="configName" placeholder="default">
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

                <div class="form-group">
                    <label>IP de Companion (Remote)</label>
                    <input type="text" id="remoteIp" placeholder="127.0.0.1">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Puerto Remote</label>
                        <input type="number" id="remotePort">
                    </div>
                    <div class="form-group">
                        <label>Puerto Rest (Web UI)</label>
                        <input type="number" id="restPort">
                    </div>
                </div>
                <label>Plugins Activos</label>
                <div class="grid-2" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius:6px;">
                    <label class="checkbox-group"><input type="checkbox" id="plugin_streamdeck"> StreamDeck</label>
                    <label class="checkbox-group"><input type="checkbox" id="plugin_loupedeck"> Loupedeck</label>
                    <label class="checkbox-group"><input type="checkbox" id="plugin_infinitton"> Infinitton</label>
                </div>
            </div>

            <!-- Companion Manager -->
            <div class="form-section">
                <h3>Gestión de Software</h3>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-size: 0.9rem; font-weight: bold;">Satellite Companion</div>
                        <div id="localVersion" style="font-size: 0.8rem; color: #94a3b8;">Verificando...</div>
                    </div>
                    <button class="btn-secondary" onclick="checkCompanionOnline()"
                        style="padding: 6px 12px; font-size: 0.8rem;">
                        🔍 Comprobar
                    </button>
                </div>

                <div id="updateArea"
                    style="display: none; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
                    <div id="updateMsg" style="font-size: 0.85rem; margin-bottom: 8px;"></div>
                    <div style="display: flex; gap: 10px;">
                        <button id="btnUpdate" class="btn-success" onclick="triggerUpdate()"
                            style="display:none; width: 100%;">Actualizar</button>
                        <button id="btnInstall" class="btn-primary" onclick="triggerInstall()"
                            style="display:none; width: 100%;">Instalar</button>
                    </div>
                </div>
            </div>

            <!-- Network Config -->
            <div class="form-section">
                <h3>Configuración de Red</h3>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="vlan_active"> <b>Habilitar VLAN</b>
                    </label>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>VLAN ID</label>
                        <input type="number" id="vlan_id" min="1" max="4094">
                    </div>
                    <div class="form-group">
                        <label>Modo IP</label>
                        <select id="ip_mode" onchange="toggleStaticFields()">
                            <option value="dhcp">DHCP (Auto)</option>
                            <option value="static">Static (Manual)</option>
                        </select>
                    </div>
                </div>
                <div id="staticFields" style="display: none;">
                    <div class="form-group">
                        <label>Dirección IP</label>
                        <input type="text" id="ip_addr" placeholder="192.168.1.100">
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Máscara (CIDR)</label>
                            <input type="text" id="ip_mask" placeholder="24">
                        </div>
                        <div class="form-group">
                            <label>Gateway</label>
                            <input type="text" id="ip_gw" placeholder="Opcional">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn-success" id="saveBtn" onclick="saveConfig()">💾 Guardar y Salir</button>
                <button class="btn-primary" id="pingBtn" onclick="openPingModal()" style="display: none;">🌐
                    Ping</button>
                <button class="btn-secondary" id="restartBtn" onclick="restartService()" style="display: none;">🔄
                    Reiniciar</button>
                <button class="btn-danger" id="closeConfigBtn" onclick="closeConfig()" style="display: none;">🚪
                    Cancelar</button>
            </div>

            <div class="status-bar" id="statusBar">
                <span id="statusText">Iniciando...</span>
                <div class="status-dot"></div>
            </div>
        </div>

        <div class="panel-right">
            <iframe id="satelliteFrame"></iframe>
        </div>
    </div>

    <!-- Ping Modal -->
    <div id="pingOverlay" class="overlay">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Diagnóstico de Conectividad</span>
                <button class="modal-close" onclick="closePingModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="pingLogModal">Preparando...</div>
                <div style="margin-top: 20px; text-align: right;">
                    <button class="btn-secondary" onclick="closePingModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="loadingOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:20000; justify-content:center; align-items:center; flex-direction:column; color:white; text-align:center;">
        <h2 id="loadingTitle">Instalando</h2>
        <div id="loadingMessage" style="color: #aaa; margin: 20px 0;">...</div>
        <div
            style="width: 300px; height: 6px; background: #222; border-radius: 10px; overflow: hidden; border: 1px solid #333;">
            <div id="progressBar"
                style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.4s;"></div>
        </div>
        <button id="cancelInstallBtn" class="btn-danger" style="margin-top:20px; display:none;"
            onclick="cancelInstall()">CANCELAR</button>
    </div>

    <script>
        let ws;
        let activePreset = '';
        let originalPresetName = '';
        let isConfigMode = false;
        let currentLocalVersion = null;
        let wasInstalling = false;

        async function init() {
            connectWS();
            await checkStatus(); // Primero checking de estado para saber si es config
            await loadActivePresetData();
            checkCompanionLocal();
            // checkStatus ya fue llamado, pero mantenemos el intervalo
            setInterval(checkStatus, 3000);
        }

        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${window.location.host}/ws`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'ping_log') handlePingLog(msg.data);
            };
            ws.onclose = () => setTimeout(connectWS, 3000);
        }

        async function loadActivePresetData() {
            try {
                const res = await fetch(`/api/presets/content/active`);
                const data = await res.json();

                activePreset = data._preset_name || 'default';
                originalPresetName = activePreset;

                document.getElementById('configName').value = activePreset;

                // Satellite
                document.getElementById('remoteIp').value = data.remoteIp || '127.0.0.1';
                document.getElementById('remotePort').value = data.remotePort || 16622;
                document.getElementById('restPort').value = data.restPort || 9999;

                const plugins = data.surfacePluginsEnabled || {};
                document.getElementById('plugin_streamdeck').checked = !!plugins['elgato-streamdeck'];
                document.getElementById('plugin_loupedeck').checked = !!plugins['loupedeck'];
                document.getElementById('plugin_infinitton').checked = !!plugins['infinitton'];

                // Network
                const net = data.net || {};
                document.getElementById('vlan_active').checked = !!net.vlan_active;
                document.getElementById('vlan_id').value = net.vlan || 60;
                document.getElementById('ip_mode').value = net.ip_mode || 'dhcp';
                document.getElementById('ip_addr').value = net.ip || '';
                document.getElementById('ip_mask').value = net.mask || '';
                document.getElementById('ip_gw').value = net.gateway || '';

                toggleStaticFields();

                if (!isConfigMode) {
                    const iframe = document.getElementById('satelliteFrame');
                    const target = `http://${window.location.hostname}:${data.restPort || 9999}`;
                    if (iframe.src !== target) iframe.src = target;
                }
            } catch (e) {
                console.error("Error loading active preset", e);
            }
        }

        function toggleStaticFields() {
            const mode = document.getElementById('ip_mode').value;
            document.getElementById('staticFields').style.display = (mode === 'static') ? 'block' : 'none';
        }

        async function saveConfig() {
            const name = document.getElementById('configName').value.trim() || 'default';
            const restart = !isConfigMode; // In real mode, we restart. In config mode, we stop.

            const content = {
                remoteIp: document.getElementById('remoteIp').value,
                remotePort: parseInt(document.getElementById('remotePort').value),
                restPort: parseInt(document.getElementById('restPort').value),
                surfacePluginsEnabled: {
                    "elgato-streamdeck": document.getElementById('plugin_streamdeck').checked,
                    "loupedeck": document.getElementById('plugin_loupedeck').checked,
                    "infinitton": document.getElementById('plugin_infinitton').checked
                },
                net: {
                    vlan: parseInt(document.getElementById('vlan_id').value),
                    vlan_active: document.getElementById('vlan_active').checked,
                    ip_mode: document.getElementById('ip_mode').value,
                    ip: document.getElementById('ip_addr').value,
                    mask: document.getElementById('ip_mask').value,
                    gateway: document.getElementById('ip_gw').value
                }
            };

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            try {
                const res = await fetch('/api/config/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        content,
                        original_name: originalPresetName,
                        restart
                    })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Error desconocido");
                }

                const data = await res.json();
                showToast(restart ? "Guardado con éxito. Reiniciando..." : "Guardado con éxito. Cerrando...");

                // Just wait a bit and let the service die, which will cause the iframe to gap out
                if (!restart) {
                    setTimeout(() => {
                        document.body.innerHTML =
                            `<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0f111a; color:#94a3b8; font-family:sans-serif;">
                                <p>Servicio en Standby</p>
                            </div>`;
                    }, 1000);
                } else {
                    // If restarting, give it a moment then reload UI to see it running
                    showLoadingOverlay("Reiniciando", "Esperando a que el servicio vuelva a estar en línea...");
                    setTimeout(checkAvailabilityAndReload, 3000);
                }

            } catch (e) {
                showToast("Error guardando");
                btn.disabled = false;
                btn.innerText = "💾 Guardar y Reiniciar";
            }
        }

        function showLoadingOverlay(title, message) {
            const overlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingTitle').innerText = title;
            document.getElementById('loadingMessage').innerText = message;
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('cancelInstallBtn').style.display = 'none';
            overlay.style.display = 'flex';
        }

        function checkAvailabilityAndReload() {
            const start = Date.now();
            const poller = setInterval(async () => {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2000);

                    // Add cache buster to prevent cached responses
                    const res = await fetch('/api/status?t=' + Date.now(), {
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        clearInterval(poller);
                        window.location.reload();
                    }
                } catch (e) {
                    console.log("Waiting for service...", e);
                }

                // Timeout after 60 seconds
                if (Date.now() - start > 60000) {
                    clearInterval(poller);
                    alert("El servicio tardó demasiado en responder. Intente recargar manualmente.");
                    window.location.reload();
                }
            }, 1000);
        }

        // --- Companion Manager Logic ---
        async function checkCompanionLocal() {
            const el = document.getElementById('localVersion');
            try {
                const res = await fetch('/api/companion/status');
                const data = await res.json();
                if (data.installed) {
                    currentLocalVersion = data.version;
                    el.innerText = `Instalado: v${data.version}`;
                    el.style.color = '#10b981';
                } else {
                    currentLocalVersion = null;
                    el.innerText = 'No instalado';
                    el.style.color = '#ef4444';
                }
            } catch (e) {
                el.innerText = 'Error verificando';
            }
        }

        async function checkCompanionOnline() {
            const area = document.getElementById('updateArea');
            const msg = document.getElementById('updateMsg');
            const btnUp = document.getElementById('btnUpdate');
            const btnIn = document.getElementById('btnInstall');

            area.style.display = 'block';
            msg.innerText = "Consultando GitHub...";
            btnUp.style.display = 'none';
            btnIn.style.display = 'none';

            try {
                const res = await fetch('/api/companion/check_update');
                const data = await res.json();

                if (data.error) {
                    msg.innerText = "Error consultando: " + data.error;
                    return;
                }

                const remoteVer = data.latest_version;
                msg.innerHTML = `Última versión online: <b>v${remoteVer}</b>`;

                if (!currentLocalVersion) {
                    // Not installed
                    btnIn.style.display = 'block';
                } else if (currentLocalVersion !== remoteVer) {
                    // Update available (string comparison is naive but usually works for simple tagging)
                    btnUp.style.display = 'block';
                    // Optional: Semantic version check could be better
                } else {
                    msg.innerHTML += " <span style='color:#10b981; margin-left:10px;'>✓ Actualizado</span>";
                }

            } catch (e) {
                msg.innerText = "Error de conexión.";
            }
        }

        async function triggerInstall() {
            if (!confirm("¿Instalar Satellite Companion? Esto puede tardar unos minutos.")) return;
            await fetch('/api/install', { method: 'POST' });
            showToast("Instalación solicitada");
        }

        async function triggerUpdate() {
            if (!confirm("¿Actualizar Satellite Companion? El servicio se reiniciará.")) return;
            await fetch('/api/companion/update', { method: 'POST' });
            showToast("Actualización solicitada");
        }

        function openPingModal() {
            const ip = document.getElementById('remoteIp').value;
            if (!ip) return showToast("Falta IP para ping");

            document.getElementById('pingOverlay').style.display = 'flex';
            document.getElementById('pingLogModal').innerHTML = `<div class="ping-entry ping-info">Iniciando ping a ${ip}...</div>`;

            fetch('/api/ping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([ip])
            });
        }

        function closePingModal() {
            document.getElementById('pingOverlay').style.display = 'none';
        }

        function handlePingLog(data) {
            const log = document.getElementById('pingLogModal');
            if (data.summary) {
                log.innerHTML += `<div class="ping-entry" style="color:white; font-weight:bold; margin-top:10px;">Ping finalizado (Total: ${data.total}).</div>`;
                return;
            }
            if (data.type === 'broadcast') {
                log.innerHTML += `<div class="ping-entry ping-info">${data.info}</div>`;
                return;
            }
            const statusClass = data.ok ? '' : 'ping-err';
            const statusText = data.ok ? 'ALCANZADO' : `FALLO (${data.error || 'Timeout'})`;
            log.innerHTML += `<div class="ping-entry ${statusClass}">[${new Date().toLocaleTimeString()}] ${data.ip}: ${statusText}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function restartService() {
            if (!confirm("¿Reiniciar servicio completo? (Red + Satellite)")) return;
            const res = await fetch('/api/restart_service', { method: 'POST' });
            if (res.ok) showToast("Petición de reinicio enviada");
        }

        async function closeConfig() {
            if (!confirm("¿Cerrar modo configuración? Los cambios no guardados se perderán.")) return;
            try {
                const res = await fetch('/api/close_config', { method: 'POST' });
                // En modo iframe, el dashboard recargará automáticamente al detectar el cambio de estado
                document.body.innerHTML = "<h1>Cerrando...</h1>";
            } catch (e) {
                console.error("Error closing config", e);
                alert("Error al cerrar modo configuración.");
            }
        }

        async function cancelInstall() {
            if (!confirm("¿Detener el proceso? ESTO PUEDE DEJAR LA INSTALACIÓN CORRUPTA.")) return;
            // Call stop endpoint which kills the process
            await fetch('/api/close_config', { method: 'POST' });
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                const overlay = document.getElementById('loadingOverlay');
                const bar = document.getElementById('progressBar');
                const msg = document.getElementById('loadingMessage');
                const cancelBtn = document.getElementById('cancelInstallBtn');

                if (data.state === 'running') {
                    isConfigMode = false;
                    overlay.style.display = 'none';
                    document.getElementById('statusBar').classList.remove('status-config');
                    document.getElementById('statusBar').classList.add('status-active');
                    document.getElementById('statusText').innerText = 'En servicio';

                    // Show standard elements
                    document.getElementById('pingBtn').style.display = 'flex';
                    document.getElementById('restartBtn').style.display = 'flex';

                    // Buttons Refinement
                    document.getElementById('saveBtn').innerText = "💾 Guardar y Reiniciar";
                    document.getElementById('closeConfigBtn').style.display = 'flex';
                    document.getElementById('closeConfigBtn').innerText = "🚪 Cerrar Servicio";

                } else if (data.state === 'not_installed') {
                    // Logic handled in main UI now via Companion Manager
                    // But we can check if we want to force overlay. User said: 
                    // "si me dice, hay que instalarlo, que me de la opcion de cancelar"
                    if (isConfigMode) {
                        // In config mode, we don't block. We show the manager.
                        overlay.style.display = 'none';
                    } else {
                        // In normal mode, if not installed, maybe block? 
                        // But user typically enters config mode to install.
                    }
                } else if (data.state === 'installing' || data.state === 'starting') {
                    if (data.state === 'installing') wasInstalling = true;

                    overlay.style.display = 'flex';
                    document.getElementById('loadingTitle').innerText = data.state === 'installing' ? 'Procesando...' : 'Iniciando...';
                    bar.parentElement.style.display = 'block';
                    msg.innerText = data.message || 'Procesando...';
                    bar.style.width = (data.progress || 0) + '%';

                    // Show cancel button if installing
                    if (data.state === 'installing') {
                        cancelBtn.style.display = 'block';
                    } else {
                        cancelBtn.style.display = 'none';
                    }
                } else if (wasInstalling && (data.state === 'config' || data.state === 'running')) {
                    // Transition finished!
                    window.location.reload();
                }

                // Detectar Modo Configuración desde el mensaje o el estado
                if (data.state === 'config' ||
                    (data.message && data.message.includes("Modo Configuración")) ||
                    (data.state === 'starting' && data.message && data.message.includes("Config"))) {

                    isConfigMode = true;
                    document.getElementById('saveBtn').innerText = "💾 Guardar y Salir";
                    document.getElementById('closeConfigBtn').style.display = 'flex';
                    document.getElementById('closeConfigBtn').innerText = "🚪 Cancelar";

                    // Update Status to Orange
                    document.getElementById('statusText').innerText = 'Configurando...';
                    document.getElementById('statusBar').classList.remove('status-active');
                    document.getElementById('statusBar').classList.add('status-config');

                    // Hide Operational Buttons
                    document.getElementById('pingBtn').style.display = 'none';
                    document.getElementById('restartBtn').style.display = 'none';

                    // Layout Full Screen para Config
                    overlay.style.display = 'none';

                    const panelLeft = document.querySelector('.panel-left');
                    const panelRight = document.querySelector('.panel-right');

                    if (panelLeft && panelRight) {
                        panelLeft.style.width = '100%';
                        panelLeft.style.borderRight = 'none';
                        panelRight.style.display = 'none';
                    }

                    // Asegurar que no hay iframe
                    const iframe = document.getElementById('satelliteFrame');
                    if (iframe && iframe.src !== 'about:blank') {
                        iframe.src = 'about:blank';
                    }
                }
            } catch (e) {
                document.getElementById('statusText').innerText = 'Desconectado';
            }
        }

        // function showToast(msg)... (Already exists)
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        init();
    </script>
</body>

</html>
